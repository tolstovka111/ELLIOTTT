name: Build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "serverless/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      with_core:
        description: "Bundle the Xray core (otherwise the APK runs in demo mode)"
        type: boolean
        default: true

jobs:
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run VLESS parser tests
        working-directory: serverless/worker
        run: npm test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The native core is not vendored in git; pull it in so the APK can carry
      # real traffic. Skipping this still produces a working demo-mode build.
      - name: Fetch VPN core
        if: github.event_name != 'workflow_dispatch' || inputs.with_core
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-vpn-core.sh

      - name: Report core status
        run: |
          if [ -f android/app/libs/libv2ray.aar ]; then
            echo "core=bundled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "core=absent (демо-режим)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: delta-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
