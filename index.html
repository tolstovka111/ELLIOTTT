<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Navbar</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --nav-bg: rgba(255, 255, 255, 0.22);
  --nav-border: rgba(255, 255, 255, 0.45);
  --nav-shadow: 0 24px 48px rgba(120, 60, 0, 0.22);
  --pill-bg: rgba(255, 255, 255, 0.62);
  --pill-border: rgba(255, 255, 255, 0.7);
  --text: rgba(45, 30, 15, 0.55);
  --text-active: #241505;
  --divider: rgba(90, 55, 15, 0.25);
}

:root[data-theme="dark"] {
  --nav-bg: rgba(20, 12, 22, 0.35);
  --nav-border: rgba(255, 255, 255, 0.14);
  --nav-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
  --pill-bg: rgba(30, 22, 34, 0.75);
  --pill-border: rgba(255, 255, 255, 0.16);
  --text: rgba(255, 240, 240, 0.55);
  --text-active: #ffffff;
  --divider: rgba(255, 255, 255, 0.2);
}

html,
body {
  height: 100%;
}

body {
  font-family: "Segoe UI", "SF Pro Display", -apple-system, BlinkMacSystemFont,
    Roboto, sans-serif;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f0ea;
  transition: background 0.8s ease;
}

:root[data-theme="dark"] body {
  background: #120d16;
}

/* ---------- Анимированный градиентный фон ---------- */

.bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  filter: blur(80px) saturate(1.25);
  z-index: 0;
}

.blob {
  position: absolute;
  border-radius: 50%;
  transition: background 0.8s ease;
}

.blob-pink {
  width: 75vmax;
  height: 75vmax;
  left: -25vmax;
  top: -10vmax;
  background: radial-gradient(circle at center, #ff3f8e 0%, rgba(255, 63, 142, 0) 65%);
  animation: drift-a 16s ease-in-out infinite alternate;
}

.blob-orange {
  width: 85vmax;
  height: 85vmax;
  right: -20vmax;
  top: -15vmax;
  background: radial-gradient(circle at center, #ffa63d 0%, rgba(255, 166, 61, 0) 65%);
  animation: drift-b 20s ease-in-out infinite alternate;
}

.blob-blue {
  width: 65vmax;
  height: 65vmax;
  right: -25vmax;
  bottom: -25vmax;
  background: radial-gradient(circle at center, #6ea8ff 0%, rgba(110, 168, 255, 0) 65%);
  animation: drift-c 18s ease-in-out infinite alternate;
}

:root[data-theme="dark"] .blob-pink {
  background: radial-gradient(circle at center, #8e1f3a 0%, rgba(142, 31, 58, 0) 65%);
}

:root[data-theme="dark"] .blob-orange {
  background: radial-gradient(circle at center, #a3243a 0%, rgba(163, 36, 58, 0) 65%);
}

:root[data-theme="dark"] .blob-blue {
  background: radial-gradient(circle at center, #24336e 0%, rgba(36, 51, 110, 0) 65%);
}

@keyframes drift-a {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(12vmax, 8vmax) scale(1.15); }
}

@keyframes drift-b {
  from { transform: translate(0, 0) scale(1.1); }
  to   { transform: translate(-10vmax, 10vmax) scale(0.95); }
}

@keyframes drift-c {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(-8vmax, -10vmax) scale(1.2); }
}

/* ---------- Стеклянная навигация ---------- */

.glass-nav {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px;
  border-radius: 999px;
  background: var(--nav-bg);
  border: 1px solid var(--nav-border);
  box-shadow: var(--nav-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
}

/* Плавающая «жидкая» пилюля под активной кнопкой */
.nav-pill {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 0;
  width: 0;
  border-radius: 999px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  box-shadow: 0 6px 16px rgba(60, 30, 0, 0.18),
    inset 0 1px 1px rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
    width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
    background 0.6s ease, border-color 0.6s ease;
  pointer-events: none;
}

.nav-btn {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border: none;
  background: transparent;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  color: var(--text);
  cursor: pointer;
  transition: color 0.35s ease, transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn:hover {
  color: var(--text-active);
}

.nav-btn:active {
  transform: scale(0.92);
}

.nav-btn.active {
  color: var(--text-active);
}

.icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.divider {
  width: 1px;
  height: 22px;
  margin: 0 6px;
  background: var(--divider);
  transition: background 0.6s ease;
}

/* ---------- Кнопка темы ---------- */

.theme-btn {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: none;
  background: transparent;
  border-radius: 50%;
  color: var(--text);
  cursor: pointer;
  transition: color 0.35s ease, transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.theme-btn:hover {
  color: var(--text-active);
}

.theme-btn:active {
  transform: scale(0.88);
}

.theme-btn .icon {
  grid-area: 1 / 1;
  width: 20px;
  height: 20px;
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.theme-btn .icon-moon {
  opacity: 0;
  transform: rotate(-90deg) scale(0.5);
}

:root[data-theme="dark"] .theme-btn .icon-sun {
  opacity: 0;
  transform: rotate(90deg) scale(0.5);
}

:root[data-theme="dark"] .theme-btn .icon-moon {
  opacity: 1;
  transform: rotate(0) scale(1);
}
  </style>
</head>
<body>
  <!-- Анимированный градиентный фон -->
  <div class="bg">
    <div class="blob blob-pink"></div>
    <div class="blob blob-orange"></div>
    <div class="blob blob-blue"></div>
  </div>

  <!-- Стеклянная навигация по центру -->
  <nav class="glass-nav" id="nav">
    <div class="nav-pill" id="pill"></div>

    <button class="nav-btn active" data-index="0" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
        <path d="M9.5 21v-6h5v6" />
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-index="1" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3
                 a2 2 0 0 1 2 1.72c.12.91.34 1.8.65 2.65a2 2 0 0 1-.45 2.11L8.09 9.91
                 a16 16 0 0 0 6 6l1.43-1.22a2 2 0 0 1 2.11-.45c.85.31 1.74.53 2.65.65
                 A2 2 0 0 1 22 16.92z" />
      </svg>
      <span>Call</span>
    </button>

    <button class="nav-btn" data-index="2" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="9" y1="6" x2="21" y2="6" />
        <line x1="9" y1="12" x2="21" y2="12" />
        <line x1="9" y1="18" x2="21" y2="18" />
        <line x1="4" y1="6" x2="4.01" y2="6" />
        <line x1="4" y1="12" x2="4.01" y2="12" />
        <line x1="4" y1="18" x2="4.01" y2="18" />
      </svg>
      <span>List</span>
    </button>

    <span class="divider"></span>

    <button class="theme-btn" id="themeBtn" type="button" aria-label="Переключить тему">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <line x1="12" y1="2" x2="12" y2="4.5" />
        <line x1="12" y1="19.5" x2="12" y2="22" />
        <line x1="4.93" y1="4.93" x2="6.7" y2="6.7" />
        <line x1="17.3" y1="17.3" x2="19.07" y2="19.07" />
        <line x1="2" y1="12" x2="4.5" y2="12" />
        <line x1="19.5" y1="12" x2="22" y2="12" />
        <line x1="4.93" y1="19.07" x2="6.7" y2="17.3" />
        <line x1="17.3" y1="6.7" x2="19.07" y2="4.93" />
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
  </nav>

  <script>
const nav = document.getElementById("nav");
const pill = document.getElementById("pill");
const themeBtn = document.getElementById("themeBtn");
const buttons = document.querySelectorAll(".nav-btn");

function updatePill(btn) {
  pill.style.left = btn.offsetLeft + "px";
  pill.style.width = btn.offsetWidth + "px";
}

buttons.forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelector(".nav-btn.active")?.classList.remove("active");
    btn.classList.add("active");
    updatePill(btn);
  });
});

themeBtn.addEventListener("click", () => {
  const root = document.documentElement;
  const isDark = root.getAttribute("data-theme") === "dark";
  root.setAttribute(
    "data-theme",
    isDark ? "light" : "dark"
  );
  setTimeout(() => {
    const active = document.querySelector(".nav-btn.active");
    if (active) updatePill(active);
  }, 100);
});

window.addEventListener("resize", () => {
  const active = document.querySelector(".nav-btn.active");
  if (active) updatePill(active);
});

window.addEventListener("load", () => {
  updatePill(document.querySelector(".nav-btn.active"));
});

updatePill(document.querySelector(".nav-btn.active"));
  </script>
</body>
</html>
